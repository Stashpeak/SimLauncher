version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release that gets yanked or hotfixed within days never reaches a PR,
    # and a PR opened during the owner's absence is not already stale (#1065).
    # Security updates are not delayed by this.
    cooldown:
      default-days: 5
    # TypeScript majors cannot pass until typescript-eslint supports them (#798):
    # TS 7 arrived as a red solo PR every month (#1061). Remove this when #798
    # is done.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    # Bundle updates into a few grouped PRs instead of one per dependency.
    # The electron stack (runtime, packaging, build, updater) is isolated
    # into its own PR so a major bump — which needs a real-launch smoke and a
    # signed-build check — never rides a batch of lint/test tooling (#634).
    # Remaining production deps are grouped separately from dev deps so runtime
    # changes still get their own reviewable PR.
    #
    # The two non-electron groups take minor and patch only, so a major leaves
    # the batch and arrives as its own PR (#908). Without this, one major made
    # the whole monthly dev batch unmergeable three times running (#790, #900,
    # #991), each time TypeScript 7, which typescript-eslint does not support
    # yet (#798). The electron group keeps every level on purpose, and the
    # other two exclude 'electron*', so an electron major still arrives in the
    # electron group and never as a solo PR.
    #
    # electron-store is the exception: it only matched 'electron*' by name. It
    # is the config store, not part of the runtime stack, and its 12.0.0 major
    # (migration semantics) rode along with an Electron major in #1058. Excluded
    # here and by the other groups' 'electron*', it arrives as its own PR.
    groups:
      electron:
        patterns:
          - 'electron*'
        exclude-patterns:
          - 'electron-store'
      production-dependencies:
        dependency-type: 'production'
        exclude-patterns:
          - 'electron*'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'electron*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'
