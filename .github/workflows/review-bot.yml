# Copy to .github/workflows/review-bot.yml in a Stashpeak org repo.
# Secrets needed (org level): CLAUDE_CODE_OAUTH_TOKEN, OPENROUTER_API_KEY, REVIEWBOT_PAT,
#   REVIEWBOT_SUPABASE_URL + REVIEWBOT_SUPABASE_KEY (optional - central data store).
# REVIEWBOT_PAT is required because review-bot is a private repo and public org repos
# cannot resolve private actions via `uses:` - we checkout with the PAT instead.
name: Review Bot
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # job-level (not workflow-level) so runs whose job is skipped by the `if`
    # (e.g. issue_comment from other bots) never cancel an in-progress review
    concurrency:
      group: review-bot-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # `github.actor`, not `github.event.pull_request.user.login`. The two differ
    # on purpose from `pr-smoke-note.yml`, which asks who AUTHORED a PR on an
    # event that a human can re-fire by editing the body. This asks who TRIGGERED
    # the run, because that is what GitHub keys the secret restriction on, and it
    # is the field their own documented example uses. On `types: [opened]` the
    # two are always equal anyway; the distinction is here so the next reader
    # does not "fix" one to match the other.
    #
    # The actor check is what keeps Dependabot PRs out (#909). GitHub runs their
    # `pull_request` workflows in a restricted context with no repository
    # secrets, so `REVIEWBOT_PAT` resolves empty and the private checkout dies on
    # `Input required and not supplied: token`. The fork guard above does not
    # catch them: Dependabot branches live in-repo, so they pass it, start the
    # job and then fail. The result was three or four PRs permanently red for a
    # reason nobody needs to read, which is how a red check stops meaning
    # anything. The `issue_comment` branch below is untouched on purpose: that
    # event runs in the base-repo context where secrets do resolve, so a manual
    # `@stashpeakbot` on a Dependabot PR still works.
    #
    # ⚠️ That exemption has one real hole, the same one `pr-smoke-note.yml`
    # names above its own Dependabot skip: `dependabot.yml` isolates the electron
    # stack into its own grouped PR precisely because a major runtime bump needs
    # real scrutiny (#634, #907). So the electron dependency PR is the one bot PR
    # that should still be reviewed, and #909 asked for that carve-out to stay
    # visible rather than be widened away silently.
    #
    # It cannot be an exception in this `if`. Secrets are unavailable to EVERY
    # Dependabot-triggered `pull_request` run regardless of which package moved,
    # so letting the electron PR through would only recreate the same red check
    # for the one PR that matters. The carve-out is therefore the manual path:
    # comment `@stashpeakbot` on the electron PR, which resolves secrets and
    # reviews it properly.
    if: >-
      (github.event_name == 'pull_request' &&
       github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@stashpeakbot'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            PR_DATA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.issue.number }}")
            HEAD_REPO=$(echo "$PR_DATA" | jq -r .head.repo.full_name)
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Review via comment is not allowed for fork PRs"
              exit 1
            fi
            echo "sha=$(echo "$PR_DATA" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - name: Fetch review-bot
        uses: actions/checkout@v7
        with:
          repository: Stashpeak/review-bot
          token: ${{ secrets.REVIEWBOT_PAT }}
          path: .review-bot
          persist-credentials: false
      - uses: ./.review-bot
        with:
          engine: claude-code
          # log-only A/B lane: any OpenRouter model id works; each comma-entry costs cents per PR
          # '|'-separated variants rotate one per PR (prNumber % count): Terra XOR Grok per PR, not both
          shadow: api:openai/gpt-5.6-terra|api:x-ai/grok-4.5,api:deepseek/deepseek-v4-flash,api:xiaomi/mimo-v2.5,api:tencent/hy3:free
          github-token: ${{ github.token }}
          app-id: ${{ vars.REVIEWBOT_APP_ID }}
          app-private-key: ${{ secrets.REVIEWBOT_APP_PRIVATE_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          supabase-url: ${{ secrets.REVIEWBOT_SUPABASE_URL }}
          supabase-key: ${{ secrets.REVIEWBOT_SUPABASE_KEY }}
