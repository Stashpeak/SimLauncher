appId: com.simlauncher.app
productName: SimLauncher
directories:
  output: dist
files:
  - out/**/*
  - package.json
  # The renderer libraries are listed under dependencies so `npm audit --omit=dev`
  # still covers them (they ship — Vite bundles them into out/renderer), but the
  # bundled output is all the app loads at runtime, so their node_modules copies
  # are dead weight in the installer. Exclude them (and their renderer-only
  # transitives) from packaging to keep the asar small. electron-store and
  # electron-updater are intentionally NOT excluded — the main process requires
  # them from node_modules at runtime.
  - '!node_modules/react/**/*'
  - '!node_modules/react-dom/**/*'
  - '!node_modules/react-colorful/**/*'
  - '!node_modules/@floating-ui/**/*'
  - '!node_modules/scheduler/**/*'
  - '!node_modules/tabbable/**/*'
  # koffi (#975) ships its C++ sources, vendored headers and docs so it can build
  # from source on platforms without a prebuilt binary. The app only loads the
  # JS entry points and the prebuilt win32-x64 `koffi.node`; the rest is ~1.8 MB
  # of installer weight that nothing reads.
  - '!node_modules/koffi/{doc,lib,vendor}/**/*'
  - '!node_modules/koffi/src/koffi/src/**/*.{cc,hh,inc,S,asm}'
  - '!node_modules/koffi/src/koffi/CMakeLists.txt'
  - '!node_modules/koffi/*.md'
  - '!node_modules/@koromix/**/*.lib'
extraResources:
  - from: assets/
    to: assets/
  - from: SimLauncher.ico
    to: SimLauncher.ico
win:
  target: nsis
  icon: SimLauncher.ico
  # Azure Artifact Signing (formerly Trusted Signing). Auth comes from the
  # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET env vars set in CI.
  azureSignOptions:
    # MUST exactly match the certificate's CommonName (CN) = the validated
    # identity (here CN=David Kohout), or SmartScreen reports a publisher mismatch.
    publisherName: 'David Kohout'
    # West Europe region endpoint (matches where the signing account was created).
    endpoint: 'https://weu.codesigning.azure.net/'
    # The Trusted/Artifact Signing account name (NOT the app registration).
    codeSigningAccountName: 'SimLauncher'
    certificateProfileName: 'SimLauncher'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Hyphenated, space-free name so the local artifact, the published GitHub
  # asset, latest.yml and SHA256SUMS.txt all agree — otherwise the default
  # "${productName} Setup ${version}" (with spaces) is sanitized to hyphens on
  # upload and `sha256sum -c SHA256SUMS.txt` fails on the downloaded asset (#614).
  artifactName: ${productName}-Setup-${version}.${ext}
  # The default is "${productName} ${version}", so Installed apps listed
  # "SimLauncher 1.2.2" while Windows already shows the version in the entry's
  # details (#982). Safe across upgrades: the uninstall registry key is the GUID
  # derived from appId, not this name, and DisplayVersion is written separately.
  uninstallDisplayName: ${productName}
publish:
  provider: github
  owner: Stashpeak
  repo: SimLauncher
